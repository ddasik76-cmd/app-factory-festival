<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir prefix="relative">.</dir>
  <dir>/tmp/fonts</dir>
  <dir>/usr/share/fonts</dir>
  <cachedir>/tmp/app-factory-font-cache</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans KR</family></prefer>
  </alias>
</fontconfig>
